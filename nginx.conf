server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── API : proxy vers le backend portfolio-api (k8s service)
    # Listé en premier pour la lisibilité, mais nginx fait
    # le match par préfixe le plus spécifique de toute façon.
    location /api/ {
        proxy_pass http://portfolio-api:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # ── Assets statiques avec cache long
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Sous-app safemode (portfolio XP)
    location /safemode {
        return 301 /safemode/;
    }
    location /safemode/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /safemode/index.html;
    }

    # ── SPA fallback — tout le reste renvoie index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}